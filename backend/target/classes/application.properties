# ═══════════════════════════════════════════════════
#  TaskSphere – Application Configuration v3
# ═══════════════════════════════════════════════════

server.port=8080

# ── Database ─────────────────────────────────────────
# Using MySQL. Make sure MySQL Server is installed and running locally,
# and that the username/password below match your actual MySQL login.
# The database "tasksphere_db" will be created automatically on first run
# (createDatabaseIfNotExist=true) — you don't need to create it by hand.
#
# Want to go back to H2 (zero-setup, embedded)? Comment out the 5 "MySQL"
# lines below and uncomment the 5 "H2" lines underneath them.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tasksphere_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Farvez@0011}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── H2 (optional — uncomment to use instead of MySQL) ───────────────
# spring.datasource.url=jdbc:h2:file:./tasksphere-data;AUTO_SERVER=TRUE
# spring.datasource.username=sa
# spring.datasource.password=
# spring.datasource.driver-class-name=org.h2.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ── JPA / Hibernate ──────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──────────────────────────────────────────────
app.jwt.secret=TaskSphere2026SecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong
app.jwt.expiration=86400000

# ── CORS ─────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500,http://localhost:5500,http://localhost:8080,http://127.0.0.1:8080,file://

# ── File Upload ───────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ── Cloudinary (for server-side signed uploads) ───────
# cloudinary.cloud-name=YOUR_CLOUD_NAME
# cloudinary.api-key=YOUR_API_KEY
# cloudinary.api-secret=YOUR_API_SECRET

# ── Google Maps (for geocoding / Distance Matrix) ─────
# Set app.maps.enabled=true and add a real key to power live geocoding +
# Distance Matrix ETAs. Until then, distance/ETA fall back to a Haversine
# straight-line estimate (still real math, just not live traffic-aware) —
# nothing breaks, nothing is faked as "live" when it isn't.
# Get a key from: https://console.cloud.google.com/google/maps-apis
app.maps.enabled=false
google.maps.api-key=YOUR_GOOGLE_MAPS_API_KEY

# ── Google Sign-In (OAuth "Continue with Google") — feature-flagged ──
# Set app.google-auth.enabled=true and paste your real OAuth Client ID
# (from https://console.cloud.google.com/apis/credentials — create an
# "OAuth client ID" of type "Web application") to turn on Google login.
# Until then, the button shows a clear "not configured" message instead
# of silently failing. The SAME client ID must also be pasted into
# frontend/index.html where GOOGLE_CLIENT_ID is defined.
app.google-auth.enabled=true
google.oauth.client-id=325515027328-9hrn3laj0rdrn5sllgv3k7uq00eg637q.apps.googleusercontent.com

# ── Razorpay (payments) — feature-flagged ─────────────
# Set app.payments.enabled=true and fill in real Razorpay keys to accept
# real payments. Until then, order-creation/verify/refund endpoints return
# a clear "not configured" error instead of pretending to work.
# Get keys from: https://dashboard.razorpay.com/app/keys
app.payments.enabled=false
razorpay.key.id=YOUR_RAZORPAY_KEY_ID
razorpay.key.secret=YOUR_RAZORPAY_KEY_SECRET
# Webhook secret is SEPARATE from the API key secret above — set this in
# Razorpay Dashboard > Settings > Webhooks when you add the webhook URL
# (https://yourdomain.com/api/webhooks/razorpay), events: payment.captured,
# payment.failed, refund.processed. This is what makes Payment Success/
# Failure callbacks reliable (server-to-server), not just client-reported.
razorpay.webhook.secret=YOUR_RAZORPAY_WEBHOOK_SECRET

# ── Email (Spring Mail) — feature-flagged ─────────────
# Set app.mail.enabled=true and fill in real SMTP creds to send real emails.
# Until then, emails are safely skipped (logged only) — nothing breaks.
# For Gmail: use an "App Password" (Google Account → Security → App Passwords),
# NOT your normal Gmail password.
app.mail.enabled=false
app.mail.from=TaskSphere <no-reply@tasksphere.in>
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-16-char-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Logging ──────────────────────────────────────────
logging.level.com.tasksphere=DEBUG
logging.level.org.springframework.security=INFO
